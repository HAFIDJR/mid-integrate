<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kasir Digital — Point of Sale</title>
  <meta name="description" content="Kasir Digital — a mobile-first point of sale for small shops. Products, cashier, receipts and reports with local persistence.">
  <meta name="theme-color" content="#f4f6f5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" role="application" aria-label="Kasir Digital Point of Sale">
    <main id="screen" class="screen" aria-live="polite"></main>
    <nav id="bottomNav" class="bottom-nav" aria-label="Main navigation"></nav>
    <button id="fab" class="fab" data-act="fab" aria-label="New sale — open cashier"></button>
    <div id="overlay-root"></div>
    <div id="toast-root" class="toast-root"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
